name: Build and tests
on:
  push:
    branches: [main, fix/execute-native-opencode-commands]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - run: dotnet build --configuration Release
      - run: dotnet test tests/OpenCodeTelegramBridge.Tests/OpenCodeTelegramBridge.Tests.csproj --configuration Release
